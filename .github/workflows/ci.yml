name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Vulnerability data changes without the code changing, so re-run weekly.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # gofmt before anything else: a formatting failure is cheap to find and
      # noisy to review.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"; echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build -trimpath ./...

      # -race because the collector caches snapshots behind two mutexes and is
      # read concurrently by every open browser tab.
      - name: test
        run: go test -race -count=1 ./...

      # The tidiness of go.mod is part of the public contract: this module is
      # meant to have exactly one external dependency.
      - name: go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # gitleaks scans history, not just the tip. This repository was
          # started with a clean history on purpose; this keeps it that way.
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
